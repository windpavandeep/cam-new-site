; Increase limits for dashboard uploads (Media Library, Video PDFs).
; post_max_size must be larger than upload_max_filesize (file + thumbnail + form data).
; For local "php artisan serve", .user.ini is ignored; run instead:
;   php -d post_max_size=32M -d upload_max_filesize=25M artisan serve
upload_max_filesize = 25M
post_max_size = 32M
